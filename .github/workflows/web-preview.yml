name: web-preview

# YAKINDA MODU (kurucu kararı 2026-11-10): internet sitesi YAYINA KAPALI.
# koybul.com yalnız tek sayfalık "Koybul — Yakında" sayfasını servis eder;
# uygulama webden ve keşif sitesi yayında DEĞİLDİR.
#
# GERİ AÇMAK İÇİN: bu dosyayı git geçmişindeki WEB-1 sürümüne döndürmek
# yeterli (keşif sitesi kökte + uygulama /app altında) — site dosyaları
# apps/web/site'ta hazır bekliyor. Flutter derlemesi olmadığı için bu iş
# ~1 dakikada biter ve her push'ta yalnız yakında sayfasını tazeler.
#
# Yayın yolu notu (2026-08'den beri aynı): site gh-pages DALINA itilir,
# GitHub Pages oradan servis eder (Settings > Pages > Branch: gh-pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yakında sayfasını hazırla
        run: |
          mkdir -p dist
          cp apps/web/yakinda/index.html dist/index.html
          # Eski sitenin/uygulamanın bilinen yolları da yakında sayfasına
          # düşsün (boş 404 yerine marka görünür).
          cp apps/web/yakinda/index.html dist/404.html
          # Arama motorlarına açıkça "indeksleme" denir.
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Yayına it (gh-pages dalı)
        working-directory: dist
        run: |
          echo koybul.com > CNAME
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "yakında sayfası: ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
