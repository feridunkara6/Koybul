name: web-preview

# Web yayını: uygulamayı tarayıcı için derler ve GH-PAGES DALINA iter.
#
# YAYIN YOLU DEĞİŞİKLİĞİ (2026-08): "Actions ile Pages yayını"
# (deploy-pages@v4) bir gün içinde dört FARKLI altyapı hatası üretti
# (deployment_queued zaman aşımı, "Multiple artifacts", "Deployment
# cancelled", Waiting kilidi). Kod her seferinde yeşildi; çuvallayan hep
# GitHub'ın yayın kuyruğuydu. Bu yüzden en eski ve en sağlam yönteme
# dönüldü: derlenen site gh-pages dalına itilir, GitHub Pages oradan
# servis eder. Kuyruk yok, paket yok, iptal yarışı yok.
#
# TEK SEFERLİK AYAR (repo sahibi): Settings > Pages > Build and deployment >
# Source: "Deploy from a branch" > Branch: gh-pages / (root) > Save.
# (gh-pages dalı bu iş akışının İLK yeşilinden sonra listede görünür.)
#
# Özel alan adı (koybul.com) her yayında CNAME dosyasıyla korunur.
# Bu iş kırmızı olsa bile api/mobile/security işlerini etkilemez.

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-pages dalına itebilmek için yazma izni gerekir.
permissions:
  contents: write

# Aynı anda tek yayın (yenisi başlarsa eskisi iptal olur — dal itmesi
# atomiktir, yarım yayın kalmaz).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true
      - name: Web iskeleti + derleme
        working-directory: apps/mobile
        run: |
          flutter create --platforms=web --project-name dockly_mobile .
          flutter pub get
          # PWA önbelleği AÇIK (2026-08 hız kararı): motor+uygulama dosyaları
          # cihazda önbelleklenir -> tekrar ziyaretler ANINDA açılır. Yeni sürüm
          # arka planda iner, bir sonraki ziyarette devreye girer.
          flutter build web --release \
            --no-tree-shake-icons \
            --dart-define=API_BASE_URL=https://dockly-proje.onrender.com \
            --dart-define=ESRI_TILE_KEY=${{ secrets.ESRI_TILE_KEY }} \
            --dart-define=ESRI_TILE_STYLE=${{ vars.ESRI_TILE_STYLE || 'arcgis/community' }} \
            --base-href="/"  # ozel alan adi (koybul.com) kok dizinde servis eder
          # ESRI_TILE_KEY tanimsizsa bos gecer -> uygulama OSM'e guvenli duser.
          # Stil degistirmek icin: Settings > Secrets and variables > Actions >
          # Variables sekmesi > ESRI_TILE_STYLE degiskeni (ör. arcgis/oceans) —
          # kod paketi GEREKMEZ, sonraki yayinla stil degisir.
      - name: Yayına it (gh-pages dalı)
        working-directory: apps/mobile/build/web
        run: |
          # Özel alan adı + Jekyll kapalı (dosyalar olduğu gibi servis edilir).
          echo koybul.com > CNAME
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "web yayını: ${GITHUB_SHA::7}"
          # Tek commit'lik dal her seferinde baştan yazılır (geçmiş sitede
          # değil kaynak depodadır — dal şişmez, yayın atomiktir).
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
