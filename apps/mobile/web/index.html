<!DOCTYPE html>
<html style="background:#0B1B2B">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Koybul — koy, marina ve bağlama noktalarını keşfet. Denizde yerini bul.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1B2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Koybul">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Koybul — Denizde yerini bul</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* HTML ön-açılış katmanı: Flutter motoru inerken BEYAZ EKRAN yerine
       anında marka zemini + aynı açılış fotoğrafı gösterilir. Flutter ilk
       karesini çizince yumuşakça silinir (flutter-first-frame). */
    html, body { margin: 0; padding: 0; height: 100%; }
    #moorira-splash {
      position: fixed; inset: 0; z-index: 9999;
      background-color: #0B1B2B;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity .45s ease;
    }
    #moorira-splash.gunduz { background-color: #CFE3F2; }
  </style>
</head>
<body>
  <div id="moorira-splash"></div>
  <script>
    (function () {
      var s = document.getElementById('moorira-splash');
      var h = new Date().getHours();
      var gece = (h >= 19 || h < 7);
      if (!gece) s.className = 'gunduz';
      // 2026-07 (kullanıcı tasarımı): DİKEY ekran dikey marka fotoğrafını,
      // YATAY ekran (bilgisayar/tablet) gerçek deniz+tekne kompozisyonunu
      // kaplar. Görsel 2:1 — dar yatay ekranlarda kırpma SOLA yaslanır ki
      // logo hep görünsün. Flutter inince aynı görselin üzerine çok yavaş
      // yakınlaşma eklenir; geçiş hissedilmez.
      s.style.backgroundSize = 'cover';
      function uydur() {
        var yatay = window.innerWidth > window.innerHeight;
        if (yatay) {
          s.style.backgroundImage = 'url(assets/assets/splash/' +
            (gece ? 'acilis_yatay_gece' : 'acilis_yatay_gunduz') + '.jpg)';
          s.style.backgroundPosition =
            (window.innerWidth / window.innerHeight >= 1.6) ? 'center' : '15% center';
        } else {
          s.style.backgroundImage = 'url(assets/assets/splash/' +
            (gece ? 'splash_gece' : 'splash_gunduz') + '.jpg)';
          s.style.backgroundPosition = 'center';
        }
      }
      uydur();
      window.addEventListener('resize', uydur);
      // Flutter ilk karesini çizince katmanı yumuşakça kaldır.
      window.addEventListener('flutter-first-frame', function () {
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 500);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
