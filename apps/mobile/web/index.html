    :root { --mark: clamp(150px, 32vmin, 240px); }
    #koybul-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0B1220 0%, #0E3052 100%);
      transition: opacity .45s ease;
      font-family: 'Poppins', -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    /* Dikey konum Flutter yüzeyiyle hizalı (blok merkezi ekranın %35'inde). */
    #koybul-splash .icerik { transform: translateY(-15vh); text-align: center; }
    #koybul-splash .isaret {
      width: calc(var(--mark) * 0.7693); height: var(--mark);
    }
    #koybul-splash .ad {
      font-weight: 700; letter-spacing: -1px; line-height: 1;
      font-size: calc(var(--mark) * 0.354);
      margin-top: calc(var(--mark) * 0.169);
      color: #F2F5F9;
    }
    #koybul-splash .slogan {
      font-size: calc(var(--mark) * 0.131);
      margin-top: calc(var(--mark) * 0.077);
      color: #93A1B8;
    }
    #koybul-splash .m-body { fill: #F2F5F9; }
    #koybul-splash .m-disc { fill: #0A2540; }
    #koybul-splash .m-wave { stroke: #F2F5F9; }
    #koybul-splash .m-sail { fill: #2EC4B6; }
    #koybul-splash.gunduz {
      background: linear-gradient(180deg, #F7FAFD 0%, #E9F2F9 100%);
    }
    #koybul-splash.gunduz .ad { color: #0A2540; }
    #koybul-splash.gunduz .slogan { color: #5B6B84; }
    #koybul-splash.gunduz .m-body { fill: #0A2540; }
    #koybul-splash.gunduz .m-disc { fill: #FFFFFF; }
    #koybul-splash.gunduz .m-wave { stroke: #0A2540; }
    /* Yükleme göstergesi: dalga üzerinde giden yelkenli — TEK animasyon. */
    #koybul-splash .yukleme {
      position: absolute; bottom: 8%;
      width: calc(var(--mark) * 1.15); height: calc(var(--mark) * 0.30);
    }
    #koybul-splash .dalga { position: absolute; inset: 0; width: 100%; height: 100%; }
    #koybul-splash .dalga path {
      fill: none; stroke: rgba(242, 245, 249, .30);
      stroke-width: 1.6; stroke-linecap: round;
    }
    #koybul-splash.gunduz .dalga path { stroke: rgba(10, 37, 64, .30); }
    #koybul-splash .tekne {
      position: absolute; bottom: 30%;
      width: calc(var(--mark) * 0.17); height: calc(var(--mark) * 0.15);
      left: -6%; animation: kb-yol 3.2s linear infinite;
    }
    #koybul-splash .tekne-sallan {
      animation: kb-salla .8s ease-in-out infinite alternate;
      transform-origin: 50% 92%;
    }
    #koybul-splash .tekne .yelken { fill: #2EC4B6; }
    #koybul-splash .tekne .govde {
      fill: none; stroke: #F2F5F9; stroke-width: 2.2; stroke-linecap: round;
    }
    #koybul-splash.gunduz .tekne .govde { stroke: #0A2540; }
    @keyframes kb-yol {
      0% { left: -6%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { left: 92%; opacity: 0; }
    }
    @keyframes kb-salla {
      from { transform: translateY(-5%) rotate(-5deg); }
      to { transform: translateY(5%) rotate(5deg); }
    }

  <script>
    (function () {
      var s = document.getElementById('koybul-splash');
      // BOYUT KİLİDİ (kullanıcı kararı 2026-08): işaret boyutu açılışta BİR
      // KEZ hesaplanır ve sabit px olarak yazılır — Safari araç çubuğunun
      // daralması, pencere/viewport oynaması logoyu ASLA yeniden boyutlayamaz.
      var vmin = Math.min(window.innerWidth, window.innerHeight);
      var mark = Math.max(150, Math.min(vmin * 0.32, 240));
      document.documentElement.style.setProperty('--mark', mark.toFixed(1) + 'px');
      var h = new Date().getHours();
      if (!(h >= 19 || h < 7)) s.classList.add('gunduz');
      // TEK-RESSAM KURALI (2026-08): web'in açılışı YALNIZ bu katmandır —
      // Flutter web'de ikinci bir açılış çizmez. Katman, uygulamanın ilk
      // karesi çizilene VE en az MIN_SURE kadar marka süresi dolana kadar
      // durur; sonra doğrudan hazır haritaya yumuşakça açılır. Logo tek kez
      // çizildiği için oynaması/boyut değiştirmesi imkânsızdır.
      //
      // FAZ 1 (hız): taban süre 1800 → 600 ms. Asıl bekleme zaten
      // 'flutter-first-frame' olayıdır; taban yalnız markanın bir flaş gibi
      // çakıp kaybolmasını önler. Hızlı bağlantıda açılış ~1,2 sn kısalır.
      var t0 = Date.now();
      var MIN_SURE = 600;
      function kaldir() {
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 500);
      }
      window.addEventListener('flutter-first-frame', function () {
        var kalan = MIN_SURE - (Date.now() - t0);
        setTimeout(kaldir, kalan > 0 ? kalan : 0);
      });
    })();
  </script>
