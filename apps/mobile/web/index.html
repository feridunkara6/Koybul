<!DOCTYPE html>
<html style="background:#0B1B2B">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Koybul — koy, marina ve bağlama noktalarını keşfet. Denizde yerini bul.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1B2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Koybul">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Koybul — Denizde yerini bul</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* HTML ön-açılış katmanı (Koybul Marka Yüzeyi): Flutter motoru inerken
       BEYAZ EKRAN yerine anında marka yüzeyi görünür. Flutter ilk karesini
       çizince yumuşakça silinir (flutter-first-frame).

       BOYUT SÖZLEŞMESİ (kullanıcı kararı 2026-08): --mark, Flutter'daki
       koybulMarkHeight() ile BİREBİR aynı formüldür →
       clamp(130px, ekranın kısa kenarı × %30, 220px). Bütün ölçüler bu
       değişkenden türediği için devralma anında logo asla büyümez/küçülmez.
       TEK animasyon: dalga üzerinde giden yelkenli (Flutter'da da aynısı). */
    html, body { margin: 0; padding: 0; height: 100%; }
    @font-face {
      font-family: 'Poppins'; font-weight: 700; font-display: swap;
      src: url('assets/assets/fonts/Poppins-Bold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Poppins'; font-weight: 400; font-display: swap;
      src: url('assets/assets/fonts/Poppins-Regular.ttf') format('truetype');
    }
    :root { --mark: clamp(130px, 30vmin, 220px); }
    #koybul-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0B1220 0%, #0E3052 100%);
      transition: opacity .45s ease;
      font-family: 'Poppins', -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    /* Dikey konum Flutter yüzeyiyle hizalı (blok merkezi ekranın %35'inde). */
    #koybul-splash .icerik { transform: translateY(-15vh); text-align: center; }
    #koybul-splash .isaret {
      width: calc(var(--mark) * 0.7693); height: var(--mark);
    }
    #koybul-splash .ad {
      font-weight: 700; letter-spacing: -1px; line-height: 1;
      font-size: calc(var(--mark) * 0.354);
      margin-top: calc(var(--mark) * 0.169);
      color: #F2F5F9;
    }
    #koybul-splash .slogan {
      font-size: calc(var(--mark) * 0.131);
      margin-top: calc(var(--mark) * 0.077);
      color: #93A1B8;
    }
    #koybul-splash .m-body { fill: #F2F5F9; }
    #koybul-splash .m-disc { fill: #0A2540; }
    #koybul-splash .m-wave { stroke: #F2F5F9; }
    #koybul-splash .m-sail { fill: #2EC4B6; }
    #koybul-splash.gunduz {
      background: linear-gradient(180deg, #F7FAFD 0%, #E9F2F9 100%);
    }
    #koybul-splash.gunduz .ad { color: #0A2540; }
    #koybul-splash.gunduz .slogan { color: #5B6B84; }
    #koybul-splash.gunduz .m-body { fill: #0A2540; }
    #koybul-splash.gunduz .m-disc { fill: #FFFFFF; }
    #koybul-splash.gunduz .m-wave { stroke: #0A2540; }
    /* Yükleme göstergesi: dalga üzerinde giden yelkenli — TEK animasyon. */
    #koybul-splash .yukleme {
      position: absolute; bottom: 8%;
      width: calc(var(--mark) * 1.15); height: calc(var(--mark) * 0.30);
    }
    #koybul-splash .dalga { position: absolute; inset: 0; width: 100%; height: 100%; }
    #koybul-splash .dalga path {
      fill: none; stroke: rgba(242, 245, 249, .30);
      stroke-width: 1.6; stroke-linecap: round;
    }
    #koybul-splash.gunduz .dalga path { stroke: rgba(10, 37, 64, .30); }
    #koybul-splash .tekne {
      position: absolute; bottom: 30%;
      width: calc(var(--mark) * 0.17); height: calc(var(--mark) * 0.15);
      left: -6%; animation: kb-yol 3.2s linear infinite;
    }
    #koybul-splash .tekne-sallan {
      animation: kb-salla .8s ease-in-out infinite alternate;
      transform-origin: 50% 92%;
    }
    #koybul-splash .tekne .yelken { fill: #2EC4B6; }
    #koybul-splash .tekne .govde {
      fill: none; stroke: #F2F5F9; stroke-width: 2.2; stroke-linecap: round;
    }
    #koybul-splash.gunduz .tekne .govde { stroke: #0A2540; }
    @keyframes kb-yol {
      0% { left: -6%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { left: 92%; opacity: 0; }
    }
    @keyframes kb-salla {
      from { transform: translateY(-5%) rotate(-5deg); }
      to { transform: translateY(5%) rotate(5deg); }
    }
  </style>
</head>
<body>
  <div id="koybul-splash">
    <div class="icerik">
      <!-- viewBox işarete birebir kırpılmıştır (birim 20..80 × 10..88):
           işaret yüksekliği tam --mark değeridir — Flutter'daki çizimle
           piksel piksel aynı; devralmada büyüme/küçülme olmaz. -->
      <svg class="isaret" viewBox="20 10 60 78" aria-label="Koybul">
        <path class="m-body" d="M50 10 C66.6 10 80 23.4 80 40 C80 51.5 73.5 61.5 64 66.5 L52.5 86 C51.4 87.9 48.6 87.9 47.5 86 L36 66.5 C26.5 61.5 20 51.5 20 40 C20 23.4 33.4 10 50 10 Z"/>
        <circle class="m-disc" cx="50" cy="40" r="20"/>
        <path class="m-wave" d="M36.5 45.5 Q50 53.5 63.5 45.5" fill="none" stroke-width="4.6" stroke-linecap="round"/>
        <path class="m-sail" d="M49 24.5 C54.5 29.5 58.5 35 59.5 41.5 L49 41.5 Z"/>
      </svg>
      <div class="ad">Koybul</div>
      <div class="slogan">Denizde yerini bul.</div>
    </div>
    <div class="yukleme">
      <svg class="dalga" viewBox="0 0 100 26" preserveAspectRatio="none">
        <path d="M0 17 Q12.5 8 25 17 T50 17 T75 17 T100 17"/>
      </svg>
      <svg class="tekne" viewBox="-10 -14 20 20">
        <g class="tekne-sallan">
          <path class="yelken" d="M0 -12 C4.6 -8.2 8.2 -3.6 9 -1.2 L0 -1.2 Z"/>
          <path class="govde" d="M-8 0 Q0 5 8 0"/>
        </g>
      </svg>
    </div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('koybul-splash');
      var h = new Date().getHours();
      if (!(h >= 19 || h < 7)) s.classList.add('gunduz');
      // Flutter ilk karesini çizince katmanı yumuşakça kaldır.
      window.addEventListener('flutter-first-frame', function () {
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 500);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
